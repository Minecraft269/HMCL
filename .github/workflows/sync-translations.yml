name: Sync Translations

on:
  schedule:
    - cron: '0 11 * * *'  # Every day at 11:00 UTC (19:00 Beijing time)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-translations
  cancel-in-progress: false

jobs:
  sync-translations:
    if: ${{ github.repository_owner == 'HMCL-dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for commit comparison

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Sync translations
        run: ./gradlew syncTranslations

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate PR body
        if: steps.check-changes.outputs.has_changes == 'true'
        id: generate-body
        uses: actions/github-script@v7
        with:
          script: |
            const script = require("./.github/scripts/generate-pr-body.js");
            await script({ github, context, core });

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Sync translations

            - Synchronize translation keys with I18N.properties
            - Add new untranslated keys (marked as comments)
            - Remove deprecated keys
            - Update language files
          title: "chore(auto/action): 同步翻译文件"
          body: "Automatically sync translations..."  # Temporary description, will be updated in next step
          branch: auto-sync-translations
          delete-branch: true

      - name: Update PR body with detailed info
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = require("./.github/scripts/update-pr-body.js");
            await script({
              github,
              context,
              core,
              prNumber: steps.create-pr.outputs.pull-request-number,
              body: `${{ steps.generate-body.outputs.body }}`
            });
